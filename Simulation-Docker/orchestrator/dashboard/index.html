<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COFF-E Mission Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --line: #262d38;
    --text: #d7dde6; --dim: #8b95a3; --accent: #4da3ff; --pass: #3ecf8e;
    --fail: #ff6b6b; --warn: #ffb454; --run: #4da3ff; --idle: #8b95a3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  button, select, input {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  button.danger { background: #40262a; border-color: #6b2f36; color: #ffb3b3; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; letter-spacing: .3px; }
  header .controls { display: flex; gap: 8px; align-items: center; }
  #mission-select { min-width: 230px; }
  .pill { padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 12px; letter-spacing: .5px; }
  .pill.idle { background: #2a313c; color: var(--idle); }
  .pill.running { background: #10314e; color: var(--run); animation: pulse 1.2s infinite; }
  .pill.passed { background: #0f3a2a; color: var(--pass); }
  .pill.failed, .pill.aborted { background: #43201f; color: var(--fail); }
  @keyframes pulse { 50% { opacity: .55; } }
  .chips { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--dim); }
  .chip { display: inline-flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fail); }
  .dot.on { background: var(--pass); }
  .chip a { color: var(--accent); text-decoration: none; }
  .chip a:hover { text-decoration: underline; }

  main {
    flex: 1; display: grid; gap: 12px; padding: 12px; overflow: auto;
    grid-template-columns: 430px minmax(360px, 1fr) minmax(320px, 1fr);
    grid-template-rows: auto auto 190px;
    grid-template-areas: "steps robot arm" "steps robot arm" "log log log";
  }
  /* No overflow:hidden here: on a grid item it drops the automatic minimum
     height to 0, and the grid then squeezes panels below their content. */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; display: flex; flex-direction: column; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  #steps-panel { grid-area: steps; }
  #robot-panel { grid-area: robot; }
  #arm-panel { grid-area: arm; }
  #log-panel { grid-area: log; }

  /* steps */
  #steps { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .step { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .step.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .step.passed { border-color: #1d4a37; }
  .step.failed, .step.aborted { border-color: #6b2f36; }
  .step .row1 { display: flex; gap: 8px; align-items: center; }
  .step .idx {
    width: 20px; height: 20px; border-radius: 50%; flex: 0 0 20px;
    display: flex; align-items: center; justify-content: center;
    background: #2a313c; font-size: 11px; font-weight: 700;
  }
  .step.passed .idx { background: #0f3a2a; color: var(--pass); }
  .step.failed .idx, .step.aborted .idx { background: #43201f; color: var(--fail); }
  .step.running .idx { background: #10314e; color: var(--run); }
  .step .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .step .icon { font-size: 13px; }
  .step .type { color: var(--dim); font-size: 11px; }
  .step .detail { margin: 3px 0 0 28px; color: var(--dim); font-size: 12px; min-height: 16px; }
  .step.passed .detail { color: #7fc9a9; }
  .step.failed .detail, .step.aborted .detail { color: #f09c9c; }
  .bar { height: 4px; border-radius: 2px; background: #222a34; margin: 6px 0 0 28px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0%; transition: width .4s; }
  .step.passed .bar > div { background: var(--pass); }
  .step.failed .bar > div { background: var(--fail); }

  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; margin-bottom: 8px; }
  .kv div { background: var(--panel2); border-radius: 6px; padding: 5px 8px; }
  .kv .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .kv .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim); }

  canvas { background: #0b0e12; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
  #traj-canvas { height: 240px; }
  #arm-canvas { height: 200px; margin-top: 8px; }

  .joints { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; }
  .joint .head { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }
  .joint .val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .jbar { position: relative; height: 8px; background: #222a34; border-radius: 4px; margin-top: 3px; }
  .jbar .zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: #3a4452; }
  .jbar .fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
  .jbar .target { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--warn); border-radius: 1px; }

  .views { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .views iframe { width: 100%; height: 320px; border: 1px solid var(--line); border-radius: 8px; background: #0b0e12; }

  #log { font: 12px/1.6 Consolas, "Cascadia Mono", monospace; overflow-y: auto; flex: 1; }
  #log .t { color: #5a6472; }
  #log .pass { color: var(--pass); }
  #log .fail { color: var(--fail); }
  #log div { white-space: pre-wrap; }
  #reason {
    margin: 6px 0 0; padding: 6px 10px; border-radius: 6px; display: none;
    background: #43201f; color: #ffb3b3; font-size: 12px;
  }
  #steps-panel #steps { max-height: 70vh; }

  /* step editor */
  .edbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .edbar button { padding: 4px 10px; }
  #ed-name { flex: 1; min-width: 150px; background: #0b0e12; }
  #ed-file { font-size: 11px; margin-bottom: 6px; }
  #ed-banner { font-size: 12px; margin-bottom: 8px; padding: 5px 8px; border-radius: 6px; background: var(--panel2); }
  #ed-banner.err { background: #43201f; color: #ffb3b3; }
  #ed-banner.ok { color: #7fc9a9; }
  .step .head { cursor: pointer; }
  .step.open { border-color: var(--warn); }
  .step.invalid { border-color: var(--fail); }
  .step.locked .name::after { content: " 🔒"; font-size: 11px; }
  .step.skipped, .step.pending { opacity: .9; }
  .step .sum { margin: 2px 0 0 28px; font-size: 12px; color: #b9c2ce; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 1px 6px; border-radius: 4px; flex: 0 0 auto; }
  .badge.avular { background: #10314e; color: #7cc0ff; }
  .badge.xarm { background: #2a2350; color: #b3a6ff; }
  .badge.wait { background: #2a313c; color: var(--dim); }
  .form { margin: 10px 0 2px 28px; display: grid; gap: 6px; }
  .form label, .form .frow { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  .form input, .form select { background: #0b0e12; padding: 4px 8px; width: 100%; min-width: 0; }
  .form input:disabled, .form select:disabled { opacity: .55; }
  .devices { display: flex; gap: 4px; flex-wrap: wrap; }
  .devices button { padding: 3px 8px; font-size: 12px; }
  .devices button.on { border-color: var(--accent); background: #10314e; color: #cfe6ff; }
  .angles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .angles input { padding: 4px; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .acts button { padding: 2px 8px; font-size: 12px; }
  .addbar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .addbar button { padding: 4px 10px; font-size: 12px; }
  @media (max-width: 1150px) {
    main { grid-template-columns: 1fr 1fr; grid-template-areas: "steps robot" "steps arm" "log log"; }
  }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: auto;
           grid-template-areas: "steps" "robot" "arm" "log"; }
    #log-panel { height: 220px; }
  }
</style>
</head>
<body>
<header>
  <h1>COFF-E Mission Dashboard</h1>
  <div class="controls">
    <select id="mission-select" title="Mission file (from orchestrator/missions)"></select>
    <button id="start" class="primary" title="Runs the mission as it is in the step editor">Start mission</button>
    <button id="abort" class="danger" disabled>Abort</button>
  </div>
  <span id="state" class="pill idle">IDLE</span>
  <div class="chips">
    <span class="chip" title="Is the Origin One simulation publishing /robot/odom?">
      <span id="robot-dot" class="dot"></span> robot <span id="robot-xy" class="muted"></span>
    </span>
    <span class="chip" title="Is the xArm SDK connected?">
      <span id="arm-dot" class="dot"></span> arm <span id="arm-state" class="muted"></span>
    </span>
    <span class="chip" id="sim-chip" title="Gazebo sim time vs real time (0.5 = the sim runs at half speed)">sim —</span>
    <span class="chip" id="map-chip" title="Loaded Cerebra map"></span>
    <span class="chip">views:
      <a href="http://localhost:6080/vnc.html?autoconnect=true&resize=scale" target="_blank">Gazebo</a>
      <a href="http://localhost:6081/vnc.html?autoconnect=true&resize=scale" target="_blank">RViz</a>
      <a href="http://localhost:18333" target="_blank">UFACTORY Studio</a>
    </span>
  </div>
</header>

<main>
  <section class="panel" id="steps-panel">
    <h2>Step editor <span id="mission-name" class="muted" style="text-transform:none;letter-spacing:0">click a step to edit it</span></h2>
    <div class="edbar">
      <input id="ed-name" placeholder="Mission name" title="Mission name">
      <button id="ed-save" title="Save to the selected mission file">Save</button>
      <button id="ed-saveas">Save as…</button>
      <button id="ed-new">New</button>
    </div>
    <div id="ed-file" class="muted"></div>
    <div id="ed-banner"></div>
    <div id="reason"></div>
    <div id="steps"></div>
    <div class="addbar"><span class="muted">Add step:</span>
      <button data-add="avular">+ Avular Origin One</button>
      <button data-add="xarm">+ xArm 6</button>
      <button data-add="wait">+ Wait</button>
    </div>
  </section>

  <section class="panel" id="robot-panel">
    <h2>Origin One (ROS 2 simulation)</h2>
    <div class="kv" id="robot-kv"></div>
    <canvas id="traj-canvas"></canvas>
    <div class="views">
      <button id="btn-gazebo">Show Gazebo view</button>
      <span class="muted" id="traj-note" style="align-self:center"></span>
    </div>
    <div id="gazebo-frame" class="views"></div>
  </section>

  <section class="panel" id="arm-panel">
    <h2>xArm 6 (UFACTORY simulation)</h2>
    <div class="joints" id="joints"></div>
    <canvas id="arm-canvas" title="Stylized side view: J2 (shoulder) and J3 (elbow)"></canvas>
    <div class="views">
      <button id="btn-studio">Show UFACTORY Studio view</button>
      <span class="muted" style="align-self:center">J1 is the base rotation, the sketch shows J2/J3</span>
    </div>
    <div id="studio-frame" class="views"></div>
  </section>

  <section class="panel" id="log-panel">
    <h2>Log</h2>
    <div id="log"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const STEP_ICON = { pending: "·", running: "▶", passed: "✓", failed: "✗", skipped: "·", aborted: "⏹" };
const ARM_LINKS = { 1: 0.267, 2: 0.371, 3: 0.405 };  // stylized xArm 6 side view (m)
let latest = null;
let logLines = 0;

async function api(method, body) {
  try {
    const res = await fetch("/api/" + method, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const json = await res.json();
    if (!res.ok) { flash(json.error || res.statusText); return null; }
    return json;
  } catch (err) { flash(String(err)); return null; }
}

function flash(msg) {
  const el = $("reason");
  el.style.display = "block";
  el.textContent = msg;
  setTimeout(() => { if (el.textContent === msg) el.style.display = "none"; }, 8000);
}

/* ---------------------------------------------------------------- header */

function renderMissions(missions) {
  const sel = $("mission-select");
  const chosen = localStorage.getItem("mission") || (missions[0] && missions[0].file);
  sel.innerHTML = "";
  for (const m of missions) {
    const opt = document.createElement("option");
    opt.value = m.file;
    opt.textContent = m.error ? `${m.file} (error)` : `${m.name} — ${m.file}`;
    opt.disabled = !!m.error;
    if (m.error) opt.title = m.error;
    sel.appendChild(opt);
  }
  if (chosen && missions.some(m => m.file === chosen && !m.error)) sel.value = chosen;
  else if (missions.length) sel.value = missions.find(m => !m.error)?.file || "";
}

function renderHeader(st) {
  const state = st.mission.state;
  const pill = $("state");
  pill.textContent = state.toUpperCase();
  pill.className = "pill " + state;
  $("start").disabled = state === "running" || !ed.doc;
  $("abort").disabled = state !== "running";
  $("mission-select").disabled = state === "running";
  $("ed-new").disabled = state === "running";

  $("robot-dot").classList.toggle("on", st.robot.connected);
  $("robot-xy").textContent = st.robot.connected
    ? `x ${st.robot.x.toFixed(2)}  y ${st.robot.y.toFixed(2)}` : "not connected";
  $("arm-dot").classList.toggle("on", st.arm.connected);
  $("arm-state").textContent = st.arm.connected ? "connected" : st.arm.state;

  const f = st.robot.time_factor;
  $("sim-chip").textContent = f ? `sim ${f.toFixed(2)}x` : "sim (no /clock)";
  $("map-chip").textContent = st.robot.map ? `map: ${st.robot.map}` : "";
}

/* ----------------------------------------------------------------- steps */

function renderReason(mission) {
  const reason = $("reason");
  if (mission.reason && mission.state !== "running") {
    reason.style.display = "block";
    reason.textContent = mission.state === "failed" ? "FAILED: " + mission.reason
      : mission.state === "aborted" ? "ABORTED: " + mission.reason : "";
  } else if (mission.state !== "failed" && mission.state !== "aborted") {
    reason.style.display = "none";
  }
}

/* ----------------------------------------------------------- step editor */
// The editor holds the mission as written in the file (raw steps). While a
// mission started from here runs, the editor and the engine use the same
// step indexes, so the live status is drawn straight onto the edited steps.
const DEVICE_TYPES = { avular: ["drive", "goto"], xarm: ["arm_joint", "arm_home"], wait: ["wait"] };
const DEVICE_NAME = { avular: "Avular Origin One", xarm: "xArm 6", wait: "Wait" };
const DEVICE_BADGE = { avular: "AVULAR", xarm: "XARM", wait: "WAIT" };
const TYPE_LABEL = { drive: "Drive for a time", goto: "Navigate with Nav2", arm_joint: "Move joints", arm_home: "Home position", wait: "Wait" };
const ed = { doc: null, file: "", saved: "", open: -1, runId: null, error: "", errStep: -1, liveMsg: "", renderedLock: -2, loading: false };
let validateTimer = null;

function deviceOf(type) { return type === "wait" ? "wait" : String(type).startsWith("arm") ? "xarm" : "avular"; }
function dirty() { return ed.doc && JSON.stringify(ed.doc) !== ed.saved; }
function waypointNames() { return ((latest && latest.robot.waypoints) || []).map(w => w.name); }

function linkedRunning() {
  const m = latest && latest.mission;
  return !!(m && ed.runId && m.run_id === ed.runId && m.state === "running");
}
function lockedUpTo() { return linkedRunning() ? latest.mission.current : -1; }

function defaultStep(type) {
  switch (type) {
    case "drive": return { name: "Drive forward for 10 s", type, duration: 10, linear: 0.25, angular: 0, check: { min_distance: 0.5 } };
    case "goto": return { name: "Navigate to a waypoint", type, waypoint: waypointNames()[0] || "Home" };
    case "arm_joint": return { name: "Arm: joint 1 to 90 degrees", type, joint: 1, angle_deg: 90, speed: 30, check: { tolerance_deg: 3 } };
    case "arm_home": return { name: "Arm: back to home", type, speed: 30 };
    default: return { name: "Wait 5 s", type: "wait", duration: 5 };
  }
}

function summary(s) {
  const n = (v, d = 0) => (v === undefined || v === null || v === "") ? "?" : Number(v).toFixed(d);
  switch (s.type) {
    case "drive": {
      let t = `drive ${n(s.duration)} s at ${n(s.linear ?? 0, 2)} m/s`;
      if (s.angular) t += `, turning ${n(s.angular, 2)} rad/s`;
      if (s.check && s.check.min_distance != null) t += ` · check: moved ≥ ${s.check.min_distance} m`;
      return t;
    }
    case "goto":
      return s.waypoint != null ? `Nav2 to waypoint "${s.waypoint}"`
        : `Nav2 to x ${n(s.x, 2)}, y ${n(s.y, 2)}, yaw ${n(s.yaw ?? 0, 2)}`;
    case "arm_joint": {
      const tol = (s.check && s.check.tolerance_deg) ?? 3;
      const what = s.angles
        ? s.angles.map((a, j) => a == null ? null : `J${j + 1} ${a}°`).filter(Boolean).join(", ")
        : `J${s.joint} to ${s.angle_deg}°`;
      return `${what || "no joints set"} at ${s.speed ?? 30}°/s · check: ±${tol}°`;
    }
    case "arm_home": return `all joints to 0° at ${s.speed ?? 30}°/s`;
    case "wait": return `wait ${n(s.duration)} s`;
  }
  return String(s.type);
}

/* form helpers: data-path names the key in the raw step ("check.min_distance", "angles.2") */
function fld(label, path, value, attrs) {
  const v = value === undefined || value === null ? "" : escapeHtml(value);
  return `<label><span>${label}</span><input data-path="${path}" value="${v}" ${attrs || ""}></label>`;
}
function num(label, path, value, unit, dis, placeholder) {
  return fld(`${label}${unit ? ` <span class="muted">(${unit})</span>` : ""}`, path, value,
    `type="number" step="any" ${dis} ${placeholder ? `placeholder="${placeholder}"` : ""}`);
}

function stepForm(s, i, lock) {
  const locked = i <= lock;
  const dis = locked ? "disabled" : "";
  const dev = deviceOf(s.type);
  let h = `<div class="frow">Done by<div class="devices">` +
    Object.keys(DEVICE_NAME).map(d =>
      `<button data-dev="${d}" class="${d === dev ? "on" : ""}" ${dis}>${DEVICE_NAME[d]}</button>`).join("") +
    `</div></div>`;
  if (DEVICE_TYPES[dev].length > 1) {
    h += `<label>Action<select data-act="type" ${dis}>` + DEVICE_TYPES[dev].map(t =>
      `<option value="${t}" ${t === s.type ? "selected" : ""}>${TYPE_LABEL[t]}</option>`).join("") + `</select></label>`;
  }
  h += fld("Name", "name", s.name, dis);
  const chk = s.check || {};
  switch (s.type) {
    case "drive":
      h += num("Duration", "duration", s.duration, "s", dis);
      h += num("Speed", "linear", s.linear, "m/s, minus = backwards", dis);
      h += num("Turn rate", "angular", s.angular, "rad/s", dis);
      h += num("Check: min. distance", "check.min_distance", chk.min_distance, "m", dis, "no check");
      break;
    case "goto": {
      const wpMode = s.waypoint != null;
      h += `<label>Target<select data-act="gotomode" ${dis}>
        <option value="wp" ${wpMode ? "selected" : ""}>Cerebra waypoint</option>
        <option value="xy" ${wpMode ? "" : "selected"}>Map coordinates</option></select></label>`;
      if (wpMode) {
        const names = waypointNames();
        if (!names.includes(s.waypoint)) names.push(s.waypoint);
        h += `<label>Waypoint<select data-path="waypoint" data-kind="str" ${dis}>` + names.map(w =>
          `<option ${w === s.waypoint ? "selected" : ""}>${escapeHtml(w)}</option>`).join("") + `</select></label>`;
      } else {
        h += num("x", "x", s.x, "m", dis) + num("y", "y", s.y, "m", dis) + num("Yaw", "yaw", s.yaw, "rad", dis);
      }
      break;
    }
    case "arm_joint": {
      const all = Array.isArray(s.angles);
      h += `<label>Joints<select data-act="armmode" ${dis}>
        <option value="one" ${all ? "" : "selected"}>One joint</option>
        <option value="all" ${all ? "selected" : ""}>Several joints</option></select></label>`;
      if (all) {
        h += `<div class="frow"><span>Angles <span class="muted">(°, empty = keep)</span></span><div class="angles">` +
          s.angles.map((a, j) => `<input type="number" step="any" data-path="angles.${j}" placeholder="J${j + 1}"
            value="${a == null ? "" : a}" title="J${j + 1}" ${dis}>`).join("") + `</div></div>`;
      } else {
        h += `<label>Joint<select data-path="joint" data-kind="int" ${dis}>` + [1, 2, 3, 4, 5, 6].map(j =>
          `<option value="${j}" ${j === s.joint ? "selected" : ""}>J${j}${j === 1 ? " (base rotation)" : ""}</option>`).join("") +
          `</select></label>`;
        h += num("Angle", "angle_deg", s.angle_deg, "°", dis);
      }
      h += num("Speed", "speed", s.speed, "°/s", dis);
      h += num("Check: tolerance", "check.tolerance_deg", chk.tolerance_deg, "°", dis, "3");
      break;
    }
    case "arm_home":
      h += num("Speed", "speed", s.speed, "°/s", dis);
      h += num("Check: tolerance", "check.tolerance_deg", chk.tolerance_deg, "°", dis, "3");
      break;
    case "wait":
      h += num("Duration", "duration", s.duration, "s", dis);
      break;
  }
  h += num("Timeout", "timeout", s.timeout, "real s", dis, "automatic");
  const last = ed.doc.steps.length - 1;
  const canInsert = i >= lock;
  h += `<div class="acts">
    <button data-act="up" ${locked || i - 1 <= lock ? "disabled" : ""}>↑ Up</button>
    <button data-act="down" ${locked || i === last ? "disabled" : ""}>↓ Down</button>
    <button data-act="dup" ${canInsert ? "" : "disabled"}>Duplicate</button>
    <button data-act="ins-avular" ${canInsert ? "" : "disabled"}>+ Avular after</button>
    <button data-act="ins-xarm" ${canInsert ? "" : "disabled"}>+ xArm after</button>
    <button data-act="del" class="danger" ${locked ? "disabled" : ""}>Delete</button>
    <button data-act="close">Close</button></div>`;
  if (locked) h += `<div class="muted">This step already ran or is running, so it is locked.</div>`;
  return h;
}

function renderEditor() {
  const box = $("steps");
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.path && a.closest(".step")
    ? { i: a.closest(".step").dataset.i, p: a.dataset.path, s: a.selectionStart } : null;
  if (document.activeElement !== $("ed-name")) $("ed-name").value = ed.doc ? ed.doc.name || "" : "";
  const lock = lockedUpTo();
  ed.renderedLock = lock;
  if (!ed.doc) { box.innerHTML = `<div class="muted">No mission loaded.</div>`; return; }
  box.innerHTML = ed.doc.steps.map((s, i) => {
    const dev = deviceOf(s.type);
    return `<div class="step pending ${ed.open === i ? "open" : ""} ${i <= lock ? "locked" : ""} ${ed.errStep === i ? "invalid" : ""}" id="st${i}" data-i="${i}">
      <div class="head" title="Click to edit">
        <div class="row1">
          <div class="idx">${i + 1}</div>
          <span class="badge ${dev}">${DEVICE_BADGE[dev]}</span>
          <div class="name">${escapeHtml(s.name || s.type)}</div>
          <div class="icon" id="si${i}">·</div>
        </div>
        <div class="sum">${escapeHtml(summary(s))}</div>
        <div class="detail" id="sd${i}"></div>
        <div class="bar"><div id="sb${i}"></div></div>
      </div>
      ${ed.open === i ? `<div class="form">${stepForm(s, i, lock)}</div>` : ""}
    </div>`;
  }).join("");
  if (keep) {
    const el = document.querySelector(`#st${keep.i} [data-path="${keep.p}"]`);
    if (el && !el.disabled) { el.focus(); try { el.setSelectionRange(keep.s, keep.s); } catch (e) { /* number inputs */ } }
  }
  renderFileInfo();
  renderBanner();
  if (latest) updateEditorStatus(latest);
}

function refreshHead(i) {
  const el = $("st" + i);
  if (!el || !ed.doc.steps[i]) return;
  el.querySelector(".name").textContent = ed.doc.steps[i].name || ed.doc.steps[i].type;
  el.querySelector(".sum").textContent = summary(ed.doc.steps[i]);
}

function adoptRun(m) {
  ed.doc = { name: m.mission_name, steps: m.steps.map(s => s.raw) };
  if (m.clock && m.clock !== "sim") ed.doc.clock = m.clock;
  ed.file = /\.(ya?ml|json)$/i.test(m.mission_file || "") ? m.mission_file : "";
  ed.saved = ed.file ? JSON.stringify(ed.doc) : "";
  ed.runId = m.run_id; ed.open = -1; ed.error = ""; ed.errStep = -1;
  renderEditor();
}

function updateEditorStatus(st) {
  const m = st.mission;
  if (m.state === "running" && m.run_id !== ed.runId && m.steps.length && m.steps[0].raw) {
    adoptRun(m);  // a mission started elsewhere (or before a page reload)
    return;
  }
  if (lockedUpTo() !== ed.renderedLock) { renderEditor(); return; }
  if (!ed.doc) return;
  const linked = ed.runId && m.run_id === ed.runId;
  ed.doc.steps.forEach((s, i) => {
    const el = $("st" + i);
    if (!el) return;
    const ms = linked ? m.steps[i] : null;
    const status = ms ? ms.status : "pending";
    if (!el.classList.contains(status)) {
      el.classList.remove("pending", "running", "passed", "failed", "skipped", "aborted");
      el.classList.add(status);
    }
    $("si" + i).textContent = STEP_ICON[status] || "·";
    const dur = ms && ms.duration_s && status === "passed" ? ` · ${ms.duration_s.toFixed(0)} s` : "";
    $("sd" + i).textContent = ms ? (ms.detail || "") + dur : "";
    $("sb" + i).style.width = Math.round(((ms && ms.progress) || 0) * 100) + "%";
  });
  $("mission-name").textContent = linked && m.state === "running"
    ? `running step ${m.current + 1} of ${m.steps.length}` : "click a step to edit it";
}

function renderFileInfo() {
  $("ed-file").textContent = (ed.file ? `file: ${ed.file}` : "not saved to a file yet") +
    (dirty() ? " · unsaved changes" : "");
}

function renderBanner() {
  const b = $("ed-banner");
  if (!ed.doc) { b.className = ""; b.textContent = ""; return; }
  if (ed.error) { b.className = "err"; b.textContent = "⚠ " + ed.error; return; }
  b.className = "ok";
  b.textContent = linkedRunning()
    ? (ed.liveMsg || "Mission running: 🔒 steps already ran. Edit the upcoming steps and they apply live.")
    : "✓ Mission is valid. Press Start mission to run it as shown here.";
}

function markInvalid() {
  ed.doc.steps.forEach((s, i) => { const el = $("st" + i); if (el) el.classList.toggle("invalid", i === ed.errStep); });
}

function changed(structural) {
  const m = latest && latest.mission;
  const running = linkedRunning();
  // Results of a finished run no longer describe an edited plan.
  if (!running && ed.runId && m && m.run_id === ed.runId) ed.runId = null;
  ed.liveMsg = "";
  if (structural) renderEditor(); else { refreshHead(ed.open); renderFileInfo(); }
  clearTimeout(validateTimer);
  validateTimer = setTimeout(() => validateAndPush(running), 350);
}

async function validateAndPush(running) {
  if (!ed.doc) return;
  let r;
  try {
    const res = await fetch("/api/validate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ doc: ed.doc }) });
    r = await res.json();
  } catch (err) { r = { ok: false, error: String(err) }; }
  ed.error = r.ok ? "" : r.error;
  const hit = !r.ok && /step (\d+)/.exec(r.error || "");
  ed.errStep = hit ? Number(hit[1]) - 1 : -1;
  markInvalid();
  if (r.ok && running && linkedRunning()) {
    const res = await api("live_edit", { doc: ed.doc });
    ed.liveMsg = res ? "✓ Live: the running mission now uses the edited upcoming steps." : "";
  }
  renderBanner();
}

function readValue(el) {
  if (el.dataset.kind === "int") return parseInt(el.value, 10);
  if (el.dataset.kind === "str") return el.value;
  if (el.type === "number") {
    if (el.value === "") return undefined;
    const v = Number(el.value);
    return Number.isFinite(v) ? v : undefined;
  }
  return el.value;
}

function setPath(step, path, val) {
  const parts = path.split(".");
  if (parts[0] === "angles") { step.angles[Number(parts[1])] = val === undefined ? null : val; return; }
  if (parts.length === 2) {
    const obj = step[parts[0]] || (step[parts[0]] = {});
    if (val === undefined) delete obj[parts[1]]; else obj[parts[1]] = val;
    if (!Object.keys(obj).length) delete step[parts[0]];
    return;
  }
  if (val === undefined) delete step[path]; else step[path] = val;
}

function insertStep(at, step) {
  ed.doc.steps.splice(at, 0, step);
  ed.open = at;
  changed(true);
  setTimeout(() => { const el = $("st" + at); if (el) el.scrollIntoView({ block: "nearest" }); }, 0);
}

function stepAction(act, i) {
  const steps = ed.doc.steps;
  const s = steps[i];
  if (act === "close") { ed.open = -1; renderEditor(); return; }
  if (act === "up") { [steps[i - 1], steps[i]] = [steps[i], steps[i - 1]]; ed.open = i - 1; }
  else if (act === "down") { [steps[i + 1], steps[i]] = [steps[i], steps[i + 1]]; ed.open = i + 1; }
  else if (act === "dup") return insertStep(i + 1, JSON.parse(JSON.stringify(s)));
  else if (act === "ins-avular") return insertStep(i + 1, defaultStep("drive"));
  else if (act === "ins-xarm") return insertStep(i + 1, defaultStep("arm_joint"));
  else if (act === "del") {
    if (steps.length === 1) { flash("A mission needs at least one step."); return; }
    steps.splice(i, 1); ed.open = -1;
  } else if (act === "gotomode") {
    const wp = document.querySelector(`#st${i} [data-act="gotomode"]`).value === "wp";
    if (wp) { delete s.x; delete s.y; delete s.yaw; s.waypoint = waypointNames()[0] || "Home"; }
    else { delete s.waypoint; s.x = 0; s.y = 0; s.yaw = 0; }
  } else if (act === "armmode") {
    const all = document.querySelector(`#st${i} [data-act="armmode"]`).value === "all";
    if (all) {
      s.angles = [null, null, null, null, null, null];
      if (s.joint) s.angles[s.joint - 1] = s.angle_deg ?? 0;
      delete s.joint; delete s.angle_deg;
    } else {
      const j = Array.isArray(s.angles) ? Math.max(0, s.angles.findIndex(a => a != null)) : 0;
      s.joint = j + 1; s.angle_deg = (s.angles && s.angles[j]) ?? 0;
      delete s.angles;
    }
  } else if (act === "type") {
    const t = document.querySelector(`#st${i} [data-act="type"]`).value;
    steps[i] = defaultStep(t);
  }
  changed(true);
}

$("steps").addEventListener("click", (e) => {
  const stepEl = e.target.closest(".step");
  if (!stepEl || !ed.doc) return;
  const i = Number(stepEl.dataset.i);
  const devBtn = e.target.closest("button[data-dev]");
  if (devBtn) {
    if (deviceOf(ed.doc.steps[i].type) !== devBtn.dataset.dev) {
      ed.doc.steps[i] = defaultStep(DEVICE_TYPES[devBtn.dataset.dev][0]);
      changed(true);
    }
    return;
  }
  const actBtn = e.target.closest("button[data-act]");
  if (actBtn) { stepAction(actBtn.dataset.act, i); return; }
  if (e.target.closest(".head")) { ed.open = ed.open === i ? -1 : i; renderEditor(); }
});
$("steps").addEventListener("change", (e) => {
  const el = e.target;
  const stepEl = el.closest(".step");
  if (!stepEl) return;
  const i = Number(stepEl.dataset.i);
  if (el.tagName === "SELECT" && el.dataset.act) { stepAction(el.dataset.act, i); return; }
  if (el.tagName === "SELECT" && el.dataset.path) { setPath(ed.doc.steps[i], el.dataset.path, readValue(el)); changed(false); }
});
$("steps").addEventListener("input", (e) => {
  const el = e.target;
  if (el.tagName !== "INPUT" || !el.dataset.path) return;
  const i = Number(el.closest(".step").dataset.i);
  setPath(ed.doc.steps[i], el.dataset.path, readValue(el));
  changed(false);
});
$("ed-name").addEventListener("input", (e) => { if (ed.doc) { ed.doc.name = e.target.value; changed(false); } });
document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
  if (!ed.doc) return;
  insertStep(ed.doc.steps.length, defaultStep(DEVICE_TYPES[b.dataset.add][0]));
}));

async function loadMission(file) {
  ed.loading = true;
  try {
    const res = await fetch("/api/mission/" + encodeURIComponent(file));
    const r = await res.json();
    if (r.error) { flash(r.error); return; }
    ed.doc = { name: r.doc.name || file, steps: Array.isArray(r.doc.steps) ? r.doc.steps : [] };
    if (r.doc.clock) ed.doc.clock = r.doc.clock;
    ed.file = file; ed.saved = JSON.stringify(ed.doc);
    ed.open = -1; ed.runId = null; ed.error = ""; ed.errStep = -1; ed.liveMsg = "";
    renderEditor();
    validateAndPush(false);
  } catch (err) { flash(String(err)); }
  finally { ed.loading = false; }
}

async function saveMission(file) {
  const r = await api("save", { file, doc: ed.doc });
  if (!r) return;
  ed.file = r.file; ed.saved = JSON.stringify(ed.doc);
  localStorage.setItem("mission", r.file);
  $("mission-select").dataset.sig = "";  // re-read the list, then select the file
  renderFileInfo();
}

function saveAs() {
  const name = prompt("File name (saved in orchestrator/missions):", ed.file || "my_mission.yaml");
  if (!name) return;
  const exists = latest && latest.missions.some(m => m.file === name);
  if (exists && name !== ed.file && !confirm(`${name} already exists. Overwrite it?`)) return;
  saveMission(name);
}

$("ed-save").addEventListener("click", () => { if (ed.doc) (ed.file ? saveMission(ed.file) : saveAs()); });
$("ed-saveas").addEventListener("click", () => { if (ed.doc) saveAs(); });
$("ed-new").addEventListener("click", () => {
  if (dirty() && !confirm("Discard the unsaved changes?")) return;
  ed.doc = { name: "New mission", steps: [defaultStep("drive"), defaultStep("arm_joint")] };
  ed.file = ""; ed.saved = ""; ed.open = 0; ed.runId = null; ed.error = ""; ed.errStep = -1;
  renderEditor();
  validateAndPush(false);
});
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ----------------------------------------------------------------- robot */

function renderRobot(st) {
  const r = st.robot;
  const kv = $("robot-kv");
  kv.innerHTML = "";
  const rows = [
    ["position", r.connected ? `${r.x.toFixed(2)}, ${r.y.toFixed(2)} m` : "—"],
    ["heading", r.connected ? `${(r.yaw * 180 / Math.PI).toFixed(0)}°` : "—"],
    ["speed", r.connected ? `${r.speed.toFixed(2)} m/s` : "—"],
    ["Nav2", r.nav_ready ? "reachable" : "not reachable"],
  ];
  for (const [k, v] of rows) kv.innerHTML += `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;

  drawTrajectory($("traj-canvas"), r, st.mission);
  $("traj-note").textContent = r.connected
    ? "odometry relative to the spawn point" : "waiting for /robot/odom...";
}

function drawTrajectory(canvas, r, mission) {
  const ctx = prepCanvas(canvas);
  const pts = r.trajectory || [];
  if (pts.length < 1) return;
  // waypoints relative to the spawn point (odometry frame)
  const spawn = (r.waypoints || []).find(w => w.name === r.spawn);
  const wps = spawn ? (r.waypoints || []).map(w => [w.x - spawn.x, w.y - spawn.y]) : [];
  const xs = pts.map(p => p[0]).concat(wps.map(w => w[0]), [r.x]);
  const ys = pts.map(p => p[1]).concat(wps.map(w => w[1]), [r.y]);
  const pad = 0.8;
  let minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  let minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const span = Math.max(maxX - minX, maxY - minY, 2);
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  minX = cx - span / 2; maxX = cx + span / 2; minY = cy - span / 2; maxY = cy + span / 2;
  const W = canvas.width, H = canvas.height;
  const toPx = (x, y) => [W * (x - minX) / (maxX - minX), H * (1 - (y - minY) / (maxY - minY))];

  // 1 m grid
  ctx.strokeStyle = "#1a212b"; ctx.lineWidth = 1;
  for (let gx = Math.ceil(minX); gx < maxX; gx++) {
    const [px] = toPx(gx, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke();
  }
  for (let gy = Math.ceil(minY); gy < maxY; gy++) {
    const [, py] = toPx(0, gy); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
  }
  // waypoints
  ctx.font = "11px system-ui"; ctx.textAlign = "center";
  (r.waypoints || []).forEach((w, i) => {
    if (!spawn || w.name === r.spawn) return;
    const [px, py] = toPx(w.x - spawn.x, w.y - spawn.y);
    ctx.fillStyle = "#8b95a3"; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    ctx.fillText(w.name, px, py - 7);
  });
  // driven path
  ctx.strokeStyle = "#4da3ff"; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, i) => { const [px, py] = toPx(p[0], p[1]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.stroke();
  // start
  const [sx, sy] = toPx(pts[0][0], pts[0][1]);
  ctx.fillStyle = "#3ecf8e"; ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 7); ctx.fill();
  // robot position + heading
  if (r.connected) {
    const [px, py] = toPx(r.x, r.y);
    const yaw = r.yaw;
    ctx.save(); ctx.translate(px, py); ctx.rotate(-yaw);
    ctx.fillStyle = "#4da3ff"; ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(6, 7); ctx.lineTo(0, 3); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#5a6472"; ctx.textAlign = "left";
  ctx.fillText(`${span.toFixed(0)} m square, top = +y`, 8, H - 8);
}

/* ------------------------------------------------------------------- arm */

function currentArmTargets(st) {
  const steps = st.mission.steps || [];
  const cur = steps.find(s => s.status === "running" && s.targets);
  return cur ? cur.targets : null;
}

function renderArm(st) {
  const angles = st.arm.angles;
  const targets = currentArmTargets(st);
  const box = $("joints");
  if (!box.children.length) {
    for (let j = 1; j <= 6; j++) {
      box.innerHTML += `
        <div class="joint">
          <div class="head"><span>J${j}</span><span class="val" id="jv${j}">—</span></div>
          <div class="jbar"><div class="zero"></div><div class="fill" id="jf${j}"></div>
            <div class="target" id="jt${j}" style="display:none"></div></div>
        </div>`;
    }
  }
  for (let j = 1; j <= 6; j++) {
    const v = angles ? angles[j - 1] : null;
    $("jv" + j).textContent = v === null ? "—" : v.toFixed(1) + "°";
    const fill = $("jf" + j);
    const half = 50, pct = Math.max(-50, Math.min(50, (v || 0) / 180 * 50));
    fill.style.left = (pct >= 0 ? half : half + pct) + "%";
    fill.style.width = Math.abs(pct) + "%";
    fill.style.background = v === null ? "#3a4452" : (j <= 3 ? "#4da3ff" : "#7e6bd6");
    const tgt = $("jt" + j);
    if (targets && targets[j - 1] !== null) {
      tgt.style.display = "block";
      tgt.style.left = `calc(${50 + Math.max(-50, Math.min(50, targets[j - 1] / 180 * 50))}% - 1px)`;
    } else tgt.style.display = "none";
  }
  drawArmSketch($("arm-canvas"), angles, targets);
}

function drawArmSketch(canvas, a, targets) {
  const ctx = prepCanvas(canvas);
  const W = canvas.width, H = canvas.height;
  const scale = Math.min(W / 1.3, H / 1.55);   // px per metre
  const gx = W / 2, gy = H - 14;                // base position on the canvas
  const toPx = (x, y) => [gx + x * scale, gy - y * scale];  // y up
  const d2r = Math.PI / 180;

  const drawPose = (angles, alpha) => {
    ctx.globalAlpha = alpha;
    const q2 = (angles[1] || 0) * d2r;
    const q3 = q2 + (angles[2] || 0) * d2r;
    const [bx, by] = toPx(0, 0);
    const [sx, sy] = toPx(0, ARM_LINKS[1]);
    const [ex, ey] = toPx(Math.sin(q2) * ARM_LINKS[2],
                           ARM_LINKS[1] + Math.cos(q2) * ARM_LINKS[2]);
    const [wx, wy] = toPx(Math.sin(q2) * ARM_LINKS[2] + Math.sin(q3) * ARM_LINKS[3],
                          ARM_LINKS[1] + Math.cos(q2) * ARM_LINKS[2] + Math.cos(q3) * ARM_LINKS[3]);
    // base column
    ctx.strokeStyle = "#3a4452"; ctx.lineWidth = 10; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(sx, sy); ctx.stroke();
    // upper arm / forearm
    ctx.strokeStyle = alpha === 1 ? "#4da3ff" : "#ffb454"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(wx, wy); ctx.stroke();
    // joints
    ctx.fillStyle = "#0b0e12";
    for (const [jx, jy] of [[sx, sy], [ex, ey]]) { ctx.beginPath(); ctx.arc(jx, jy, 5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  };

  // floor
  ctx.strokeStyle = "#262d38"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, gy + 8); ctx.lineTo(W, gy + 8); ctx.stroke();
  if (a) drawPose(a, 1);
  if (targets) drawPose([0, targets[1] ?? a?.[1] ?? 0, targets[2] ?? a?.[2] ?? 0, 0, 0, 0], 0.35);
  ctx.fillStyle = "#5a6472"; ctx.font = "11px system-ui"; ctx.textAlign = "left";
  ctx.fillText(a ? `J2 ${a[1].toFixed(1)}°  J3 ${a[2].toFixed(1)}°` : "waiting for the arm...",
              8, 14);
}

/* ------------------------------------------------------------------- log */

function renderLog(mission) {
  const box = $("log");
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  for (const line of mission.log.slice(logLines)) {
    const div = document.createElement("div");
    div.innerHTML = `<span class="t">${line.t}</span> <span class="${line.level}">${escapeHtml(line.text)}</span>`;
    box.appendChild(div);
  }
  logLines = mission.log.length;
  if (stick) box.scrollTop = box.scrollHeight;
}

/* ---------------------------------------------------------------- canvas */

function prepCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return ctx;
}

/* ------------------------------------------------------------------ main */

async function poll() {
  try {
    const res = await fetch("/api/status");
    const st = await res.json();
    latest = st;
    const sig = latest.missions.map(m => m.file + (m.error ? "!" : "")).join("|");
    if (!latest.missions.length) $("mission-select").innerHTML = "";
    else if ($("mission-select").dataset.sig !== sig) {
      $("mission-select").dataset.sig = sig;
      renderMissions(latest.missions);
    }
    if (!ed.doc && !ed.loading) {
      const m = st.mission;
      if (m.run_id > 0 && m.steps.length && m.steps[0].raw) adoptRun(m);
      else if ($("mission-select").value) loadMission($("mission-select").value);
    }
    renderHeader(st);
    updateEditorStatus(st);
    renderReason(st.mission);
    if (linkedRunning() || ed.liveMsg === "") renderBanner();
    renderRobot(st);
    renderArm(st);
    renderLog(st.mission);
  } catch (err) {
    $("state").textContent = "NO SERVER";
    $("state").className = "pill aborted";
  }
}

$("start").addEventListener("click", async () => {
  if (!ed.doc) return;
  const res = await api("start", { doc: ed.doc, file: ed.file || "(unsaved)" });
  if (res) {
    ed.runId = res.run_id; ed.open = -1; ed.liveMsg = "";
    logLines = 0; $("log").innerHTML = "";
    poll();
  }
});
$("abort").addEventListener("click", () => api("abort"));
$("mission-select").addEventListener("change", (e) => {
  if (dirty() && !confirm("Discard the unsaved changes in the step editor?")) {
    e.target.value = ed.file;
    return;
  }
  localStorage.setItem("mission", e.target.value);
  loadMission(e.target.value);
});

$("btn-gazebo").addEventListener("click", () => {
  const box = $("gazebo-frame");
  if (box.dataset.on) { box.innerHTML = ""; delete box.dataset.on; $("btn-gazebo").textContent = "Show Gazebo view"; return; }
  box.innerHTML = `<iframe src="http://localhost:6080/vnc.html?autoconnect=true&resize=scale"></iframe>`;
  box.dataset.on = "1"; $("btn-gazebo").textContent = "Hide Gazebo view";
});
$("btn-studio").addEventListener("click", () => {
  const box = $("studio-frame");
  if (box.dataset.on) { box.innerHTML = ""; delete box.dataset.on; $("btn-studio").textContent = "Show UFACTORY Studio view"; return; }
  box.innerHTML = `<iframe src="http://localhost:18333"></iframe>`;
  box.dataset.on = "1"; $("btn-studio").textContent = "Hide UFACTORY Studio view";
});

poll();
setInterval(poll, 500);
</script>
</body>
</html>
